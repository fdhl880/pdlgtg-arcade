<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AI Chat — pdlgtg</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: #0f0a1e; color: #e8e0f0;
    font: 400 16px/1.5 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── App Shell ─────────────────────────────────────────────────── */
  #app {
    display: flex; flex-direction: column; height: 100%;
    background: linear-gradient(180deg, #0f0a1e 0%, #1a1030 100%);
  }

  /* ── Header ────────────────────────────────────────────────────── */
  #header {
    display: flex; align-items: center; padding: 12px 16px; gap: 12px;
    background: rgba(15,10,30,0.95); border-bottom: 1px solid #2a2045;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    flex-shrink: 0; z-index: 10;
  }
  #back-btn {
    background: none; border: none; color: #a78bfa; font-size: 22px;
    cursor: pointer; padding: 4px 8px; border-radius: 8px;
    transition: background .15s;
  }
  #back-btn:active { background: #ffffff15; }
  #header-info { flex: 1; }
  #header-info h1 { font-size: 18px; font-weight: 700; color: #e8e0f0; }
  #header-info .sub { font-size: 12px; color: #8b7faa; }
  #status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 8px #4ade8088;
    transition: background .3s;
  }
  #status-dot.offline { background: #fbbf24; box-shadow: 0 0 8px #fbbf2488; }
  #status-dot.error { background: #f87171; box-shadow: 0 0 8px #f8717188; }

  /* ── Messages ──────────────────────────────────────────────────── */
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: #3a2a5e; border-radius: 4px; }

  .msg {
    max-width: 85%; padding: 12px 16px; border-radius: 18px;
    font-size: 15px; line-height: 1.5; word-wrap: break-word;
    animation: msgIn .3s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end; background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: #fff; border-bottom-right-radius: 6px;
  }
  .msg.ai {
    align-self: flex-start; background: #1e1535; border: 1px solid #2a2045;
    color: #d4c8e8; border-bottom-left-radius: 6px;
  }
  .msg.ai .ai-name {
    font-size: 11px; font-weight: 700; color: #a78bfa; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .msg.system {
    align-self: center; background: #1a1030; border: 1px solid #2a204588;
    color: #8b7faa; font-size: 13px; border-radius: 12px; text-align: center;
    max-width: 90%;
  }

  /* Typing indicator */
  .typing {
    align-self: flex-start; padding: 14px 20px;
    background: #1e1535; border: 1px solid #2a2045; border-radius: 18px;
    border-bottom-left-radius: 6px;
  }
  .typing .dots { display: flex; gap: 5px; }
  .typing .dots span {
    width: 8px; height: 8px; border-radius: 50%; background: #a78bfa;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing .dots span:nth-child(2) { animation-delay: .2s; }
  .typing .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* ── Input Area ────────────────────────────────────────────────── */
  #input-area {
    display: flex; gap: 8px; padding: 12px 16px;
    background: rgba(15,10,30,0.97); border-top: 1px solid #2a2045;
    backdrop-filter: blur(12px); flex-shrink: 0;
  }
  #msg-input {
    flex: 1; border: 1px solid #2a2045; background: #1e1535;
    color: #e8e0f0; padding: 12px 16px; border-radius: 24px;
    font-size: 15px; font-family: inherit; outline: none;
    transition: border-color .2s;
  }
  #msg-input:focus { border-color: #7c3aed; }
  #msg-input::placeholder { color: #5a4f75; }

  #send-btn {
    width: 48px; height: 48px; border: none; border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: #fff; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, opacity .15s;
    flex-shrink: 0;
  }
  #send-btn:active { transform: scale(0.9); }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Quick Actions ─────────────────────────────────────────────── */
  #quick-actions {
    display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  #quick-actions::-webkit-scrollbar { display: none; }
  .quick-btn {
    flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
    background: #1e1535; border: 1px solid #2a2045; color: #b8a8d8;
    font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .quick-btn:active { background: #2a2045; border-color: #7c3aed; }

  /* Mobile safe area */
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    #input-area { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button id="back-btn" onclick="location.href='/'">←</button>
    <div id="header-info">
      <h1>🤖 AI Chat</h1>
      <div class="sub" id="model-label">Connecting...</div>
    </div>
    <div id="status-dot" class="offline"></div>
  </div>

  <div id="quick-actions">
    <button class="quick-btn" data-msg="Ceritakan dongeng pendek yang seru!">📖 Dongeng</button>
    <button class="quick-btn" data-msg="Ceritakan joke lucu dong!">😂 Jokes</button>
    <button class="quick-btn" data-msg="Fakta random yang menarik?">🧠 Fakta</button>
    <button class="quick-btn" data-msg="Buatkan puisi pendek tentang malam">🌙 Puisi</button>
    <button class="quick-btn" data-msg="Ayo main tebak-tebakan!">🎯 Tebak</button>
    <button class="quick-btn" data-msg="Rekomendasikan lagu untuk santai">🎵 Musik</button>
    <button class="quick-btn" data-msg="Ceritakan kisah horor singkat">👻 Horor</button>
    <button class="quick-btn" data-msg="Tips hidup yang berguna?">💡 Tips</button>
  </div>

  <div id="messages">
    <div class="msg system">Welcome! Ketik apa saja untuk ngobrol dengan AI 🤖</div>
  </div>

  <div id="input-area">
    <input id="msg-input" type="text" placeholder="Ketik pesan..." autocomplete="off" />
    <button id="send-btn" disabled>▶</button>
  </div>
</div>

<script type="module" src="chat.js"></script>
  <script src="/core/back-button.js"></script>
</body>
</html>
